name: firepit-release-smoke
description: "Validate the Reactorcide configuration and render the Helm chart."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 900
  priority: 10
  working_dir: /job
environment:
  REACTORCIDE_FIREPIT_JOB: release-smoke
run_local:
  user: host
