name: firepit-test-go
description: "Vet and test the Go modules, including PostgreSQL integration tests."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 2400
  priority: 10
  working_dir: /job
  capabilities:
    - docker
  run_as:
    user: root
environment:
  REACTORCIDE_FIREPIT_JOB: test-go
run_local:
  user: root
