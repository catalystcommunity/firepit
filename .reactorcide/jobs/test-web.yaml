name: firepit-test-web
description: "Lint, test, type-check, and build the web application."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 1200
  priority: 10
  working_dir: /job
environment:
  REACTORCIDE_FIREPIT_JOB: test-web
run_local:
  user: host
