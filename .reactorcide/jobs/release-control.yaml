name: firepit-release-control
description: "Plan, authorize, verify, or publish a versioned Firepit release."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 1200
  priority: 15
  working_dir: /job
  disable_run_local: true
environment:
  REACTORCIDE_REPO: catalystcommunity/firepit
  GITHUB_PAT: "${secret:catalystcommunity/ci:githubpat}"
