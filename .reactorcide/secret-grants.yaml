apiVersion: reactorcide.catalystcommunity.io/v1alpha1
kind: SecretGrantList
items:
  - metadata:
      name: firepit-tag-ci
    spec:
      scope:
        project: github.com/catalystcommunity/firepit
      secret:
        path: catalystcommunity/ci
        match: exact
      subject:
        jobName:
          value: tag
          match: exact
      description: Allow the tag job to create the release and push its tag.

  - metadata:
      name: firepit-prepare-ci
    spec:
      scope:
        project: github.com/catalystcommunity/firepit
      secret:
        path: catalystcommunity/ci
        match: exact
      subject:
        jobName:
          value: prepare
          match: exact
      description: Allow the prepare job to verify the draft release.

  - metadata:
      name: firepit-publish-ci
    spec:
      scope:
        project: github.com/catalystcommunity/firepit
      secret:
        path: catalystcommunity/ci
        match: exact
      subject:
        jobName:
          value: publish
          match: exact
      description: Allow the publish job to publish the draft release.

  - metadata:
      name: firepit-api-image-registry
    spec:
      scope:
        project: github.com/catalystcommunity/firepit
      secret:
        path: catalystcommunity/registry
        match: exact
      subject:
        jobName:
          value: api-image
          match: exact
      description: Allow the API image job to push to the registry.

  - metadata:
      name: firepit-web-image-registry
    spec:
      scope:
        project: github.com/catalystcommunity/firepit
      secret:
        path: catalystcommunity/registry
        match: exact
      subject:
        jobName:
          value: web-image
          match: exact
      description: Allow the web image job to push to the registry.

  - metadata:
      name: firepit-deploy-registry
    spec:
      scope:
        project: github.com/catalystcommunity/firepit
      secret:
        path: catalystcommunity/registry
        match: exact
      subject:
        jobName:
          value: deploy-production
          match: exact
      description: Allow the production deploy job to create the registry pull secret.

  - metadata:
      name: firepit-deploy-k8s
    spec:
      scope:
        project: github.com/catalystcommunity/firepit
      secret:
        path: catalystcommunity/k8s
        match: exact
      subject:
        jobName:
          value: deploy-production
          match: exact
      description: Allow the production deploy job to use the cluster configuration.

  - metadata:
      name: firepit-deploy-app
    spec:
      scope:
        project: github.com/catalystcommunity/firepit
      secret:
        path: catalystsquad/firepit
        match: exact
      subject:
        jobName:
          value: deploy-production
          match: exact
      description: Allow the production deploy job to use the Firepit application secrets.
